# Rendezvous (rv) fuzzing of juice-autostake-safe. See ../README.md.
# contracts/juice-autostake-safe.clar, juice-autostake-pool.clar and
# juice-autostake-safe-auth-helpers-v1.clar are BUILD ARTIFACTS from ./build.sh.
# The production Clarinet.toml and ../../../contracts/*.clar are never edited.
[project]
name = "juice-autostake-safe-rv"
description = "RV fuzzing: juice-autostake-safe against real pox-5, sBTC and fakfun-wallet-core-v2"
authors = []
telemetry = false
cache_dir = "../../../.cache"

[repl.analysis]
passes = []

[[project.requirements]]
contract_id = "SP28MP1HQDJWQAFSQJN2HBAXBVP7H7THD1W2NYZVK.pillar-wallet-trait"

