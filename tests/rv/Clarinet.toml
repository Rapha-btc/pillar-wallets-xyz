# RV-only manifest for Rendezvous fuzzing of fakfun-wallet-v2.
#
# The wallet hardcodes ~10 external principals (sbtc-token, fakfun-
# wallet-core, fakfun-core-v2, pox-4, fast-pool-v3, auth-v7, game-
# wager-v1, burn-bob-faktory, BOB token, plus auth-helpers-v7 and
# clarity-webauthn which we own). The mainnet contracts can't be loaded
# in simnet, so tests/rv/build.sh rewrites the wallet source to use
# local mocks. Output goes to tests/rv/.build/fakfun-wallet-v2.clar
# (gitignored).
#
# Run:
#   bash tests/rv/build.sh
#   npx rv . fakfun-wallet-v2 invariant --runs=100 \
#     --config=Clarinet-fakfun-wallet-v2-rv.toml
[project]
name = "fakfun-wallet-v2-rv"
description = "RV-only manifest for fuzzing fakfun-wallet-v2"
authors = []
telemetry = false
cache_dir = "./.cache"

[repl.analysis]
passes = []
check_checker = { trusted_sender = false, trusted_caller = false, callee_filter = false }

# Order matters: traits first, then mocks, then production helpers, then SUT.

[contracts.sip-010-trait]
path = "sip-010-trait.clar"
clarity_version = 5
epoch = "3.4"

