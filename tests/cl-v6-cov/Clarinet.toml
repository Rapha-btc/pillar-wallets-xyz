# COVERAGE ONLY. clarinet --coverage instruments PROJECT contracts, never
# requirements, so measuring line coverage means deploying the wallet locally --
# which moves it off its mainnet address. contracts/juice-safe-v6.clar here is
# byte-identical to the deployed contract EXCEPT the single self-reference literal
# on line 1520 (the register-wallet canonical argument), repointed at the simnet
# deployer. Correctness runs still use tests/cl-v6 against the real address.
[contracts.juice-safe-v6]
path = "contracts/juice-safe-v6.clar"
clarity_version = 6
epoch = "4.0"
