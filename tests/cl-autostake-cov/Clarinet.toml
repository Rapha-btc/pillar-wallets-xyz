# COVERAGE ONLY. clarinet --coverage instruments PROJECT contracts, never
# requirements or simnet.deployContract deploys, so line coverage needs the safe
# deployed locally -- which moves it off SPV9K21T... The local
# contracts/juice-autostake-safe.clar is byte-identical to
# ../../contracts/juice-autostake-safe.clar EXCEPT three literals repointed to
# the local deployer: the set-keeper helper (.juice-autostake-safe-auth-helpers-v1),
# onboard's register-wallet canonical (.juice-autostake-safe) and JUICE-SIGNER
# (.juice-autostake-pool). The stand-in pool is the live juice-pool-stx-signer
# source (the launch pool is not on mainnet). It is renamed juice-autostake-pool
# only for plan order: clarinet does not see a define-constant principal as a
# dependency and orders ties by name, and the pool must exist before the safe
# (the safe passes it to pox-5 as a trait).
# Correctness runs use tests/cl-v7 with the unedited source at its real address.
# Run:
#   AUTOSTAKE_DEPLOYER=ST1PQHQKV0RJXZFY1DGX8MNSNYVE3VGZJSRTPGZGM \
#     npx vitest run tests/juice-autostake-safe-keeper.test.ts -- \
#     --manifest tests/cl-autostake-cov/Clarinet.toml --coverage

